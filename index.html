<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Wings</title>
  <meta name="theme-color" content="#87b9e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wings">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87b9e8;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #version {
      position: fixed;
      right: calc(env(safe-area-inset-right) + 10px);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #87b9e8;
      color: white;
      font-size: 18px;
      text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="version"></div>
  <div id="rotate">Turn your phone sideways to fly.</div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
